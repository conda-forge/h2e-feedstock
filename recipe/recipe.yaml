context:
  name: h2e
  version: "1.1.0"
  python_min: "3.12"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://gitlab.com/earthscope/public/epic/passoft/h2e/-/archive/v${{ version }}/h2e-v${{ version }}.tar.gz
  sha256: 78dca4767bc77ba38fc402a18ff137da904c13b1d55ec3a3d0842baee228a2e6

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - h2e = h2e.h2e:main
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - __unix

tests:
  - python:
      imports:
        - h2e
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - h2e 2026:169:15:51:23
  - script:
      - python -m unittest discover -s tests
    requirements:
      run:
        - python ${{ python_min }}.*
    files:
      source:
        - tests/

about:
  homepage: https://epic.earthscope.org/content/software-resources
  summary: Convert human readable time format to epoch
  description: |
    h2e is a command-line utility that accepts a time in Greenwich
    Mean Time (YYYY:JJJ:HH:MM:SS) format and returns the corresponding
    epoch timestamp.
  license: GPL-3.0-or-later
  license_file: LICENSE
  repository: https://gitlab.com/earthscope/public/epic/passoft/h2e

extra:
  recipe-maintainers:
    - omid-earthscope
    - destinykuehn-earthscope
